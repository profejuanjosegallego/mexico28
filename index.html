const ART={"1":{"t":"Los presentes Lineamientos tienen por objeto regular la impartición de la EMS mediante la Educación Dual, que es la opción educativa de la modalidad mixta donde el Proceso de enseñanza y el Aprendizaje se realizan en la Escuela y en un Espacio de formación laboral, es decir, Empresa o Institución Pública. Lo anterior, conforme al respectivo Plan y Programa de estudio de EMS, dando como resultado que la/el estudiante obtenga una Doble Certificación. En caso de duda, la SEP a través de la SEMS, interpretará los presentes Lineamientos, asesorará y resolverá las consultas que en la materia se le formulen.","f":{},"o":[]},"2":{"t":"Estos Lineamientos son de observancia obligatoria para:","f":{"I":"La SEMS;","II":"La DGETI;","III":"La DGETAyCM;","IV":"La DGBTED;","V":"La DGCFT, y","VI":"Las Escuelas."},"o":["I","II","III","IV","V","VI"]},"3":{"t":"La SEP, a través de la SEMS, con pleno respeto al federalismo, la autonomía universitaria y a la diversidad educativa, promoverá con las autoridades educativas de las entidades federativas, organismos descentralizados federales y locales, e instituciones con autonomía que impartan EMS, la adopción de los presentes Lineamientos mediante la suscripción de los instrumentos jurídicos correspondientes. Asimismo, la SEP, a través de la SEMS, en el ámbito de su competencia, establecerá la colaboración que se requiera con otras instituciones u organismos de los sectores público, social y privado, nacionales y extranjeras, para impulsar, fortalecer y promover la Educación Dual, mediante la formalización de los instrumentos jurídicos correspondientes.","f":{},"o":[]},"4":{"t":"Para los efectos de estos Lineamientos, se entenderá por:","f":{"I":"Actores de la Educación Dual: Personas que facilitan la relación, la coordinación, la gestión y la operación de la Educación Dual entre la Escuela y la Empresa o Institución Pública. Por parte del Sistema Nacional de Bachillerato de la Nueva Escuela Mexicana, son las o los Responsables de Educación Dual, el o la Director(a) del plantel, el o la Responsable de vinculación, la o el Docente, la o el Docente facilitador y el o la Tutor(a) académico(a); por parte de la Empresa o Institución Pública, el o la Gestor(a) del espacio de formación laboral y la o el Instructor(a);","II":"Aprendizaje: Proceso permanente por el que una persona desarrolla gradualmente sus capacidades para lograr los saberes cognitivos, procedimentales y actitudinales de la formación integral, que posibilitan cambios en sus niveles de comprensión y comportamiento a través de la instrucción, el estudio, la práctica y la experiencia;","III":"Asignatura: Serie o conjunto de aprendizajes que integran una unidad completa que tiene valor curricular porque ha sido objeto de un proceso de evaluación, acreditación y certificación para la asignación de créditos académicos. Cada asignatura agrupa saberes de distintas disciplinas por lo que favorecen la formación integral de cada estudiante;","IV":"Certificación de competencias: Reconocimiento con validez oficial en toda la República Mexicana de la competencia laboral demostrada por una persona, independientemente de la forma en que la haya adquirido, en un proceso de evaluación realizado con base en un Estándar de Competencia inscrito en el Registro Nacional de Estándares de Competencia;","V":"Certificado de competencia: Documento expedido por el CONOCER con validez oficial en toda la República Mexicana por medio del cual se reconoce la competencia laboral de las personas, de acuerdo con lo establecido en un Estándar de Competencia inscrito en el Registro Nacional de Estándares de Competencia;","VI":"Comité Directivo: Comité Directivo de la Educación Dual en el Tipo Medio Superior;","VII":"Competencia laboral de EMS: Capacidad desarrollada para emplear, demostrar o aplicar conocimientos, destrezas, habilidades, actitudes y valores en el desarrollo personal, académico, social en el ámbito laboral y profesional. Las competencias, que se dividen en básicas y extendidas, pueden describirse en términos de responsabilidad y autonomía laboral, para desenvolverse en contextos específicos y diversos a lo largo de la vida;","VIII":"Competencias laborales básicas: Proporcionan a las personas un nivel de formación laboral básica que, por su carácter genérico y transversal en diversos campos laborales y perfiles ocupacionales, les permite incorporarse al sector laboral con actividades relativamente sencillas. Para su logro se utilizan conocimientos, destrezas, habilidades, actitudes y valores en el ámbito personal, académico, social y laboral en situaciones de la vida común, de estudio y de trabajo;","IX":"Competencias laborales extendidas: Preparan a las personas para una formación laboral de nivel técnico o tecnológico, por su carácter específico en un campo laboral determinado para incorporarse al mundo del trabajo, se busca que las personas se desempeñen con un grado de complejidad más alto que la formación que se logra con las Competencias laborales básicas, debido a que están asociadas a espacios y necesidades específicas de los campos productivos. Para su logro utilizan conocimientos, destrezas, habilidades, actitudes y valores en el ámbito personal, académico, social y laboral en situaciones de la vida común, de estudio y de trabajo;","X":"CONOCER: Consejo Nacional de Normalización y Certificación de Competencias Laborales, denominación que recibe el Fideicomiso de los Sistemas Normalizado de Competencia Laboral y de Certificación de Competencia Laboral, en términos de su contrato constitutivo;","XI":"Convenio de Aprendizaje: Instrumento jurídico de carácter académico que celebran el personal directivo de la Escuela, el representante de la Empresa o Institución Pública, cada Estudiante y su madre/padre de familia o tutor legal tratándose de personas menores de edad, en el que se establecen los compromisos de cada parte para el desarrollo de las Competencias laborales tanto básicas como extendidas y que, entre otros aspectos, detalla lo previsto en los artículos 27 y 28 de los presentes Lineamientos;","XII":"Convenio de Colaboración: Instrumento jurídico que celebran la SEP, a través de la SEMS o el Subsistema, con el Organismo del Sector Empresarial, la Empresa y/o Institución Pública, en el que se establecen los compromisos de cada parte para la implementación de la Educación Dual;","XIII":"COSAC: Coordinación Sectorial Académica dependiente de la SEMS, quien funge como responsable de la articulación y coordinación académica de la Educación Dual en la EMS;","XIV":"DGBTED: Dirección General de Bachillerato Tecnológico de Educación y Promoción Deportiva;","XV":"DGCFT: Dirección General de Centros de Formación para el Trabajo;","XVI":"DGETAyCM: Dirección General de Educación Tecnológica Agropecuaria y Ciencias del Mar;","XVII":"DGETI: Dirección General de Educación Tecnológica Industrial y de Servicios;","XVIII":"Director(a) del plantel: Persona que asume los procesos y acciones necesarias de gestión y operación de la Educación Dual, coordina las áreas responsables en el plantel y delega funciones de acuerdo con sus atribuciones;","XIX":"Docente(s): Profesional en la EMS que asume ante el Estado y la sociedad la corresponsabilidad del aprendizaje de las y los Estudiantes, considerando sus capacidades, circunstancias, necesidades, estilos y ritmos de aprendizajes y, en consecuencia, contribuye al Proceso de enseñanza y al Aprendizaje, como tutor académico, facilitador y agente directo del proceso educativo;","XX":"Docente facilitador: Docente de la Escuela que acompaña a las y los Estudiantes en el logro de los componentes de formación fundamental y fundamental extendida, así como de ser el caso del Currículum ampliado; da seguimiento y evalúa el aprendizaje adquirido mediante la Plataforma Académica y en la Escuela, y registra la evaluación obtenida de las y los Estudiantes en el control escolar del plantel;","XXI":"Doble Certificación: Consiste en la obtención de los siguientes documentos académicos: i) Certificado de Terminación de Estudios de Bachillerato Nacional, que es el documento de certificación de estudios de EMS, en el que se establecen referentes mínimos que permiten describir las características generales de los Planes de estudio, al mismo tiempo que permite expresar la identidad de los estudios de EMS, y ii) Certificado de Formación Profesional, que es el documento específico para referir de manera exclusiva a la formación laboral que se imparte en las Instituciones de Educación Media Superior; incluye información cualitativa sobre el perfil de egreso al describir el nivel de las Competencias laborales adquiridas en los servicios educativos de la EMS que las imparten, con el objeto de comunicar conocimientos, destrezas, habilidades, actitudes y valores que permite el desempeño en el sector productivo y, en su caso, se otorgará con el acompañamiento de Instituciones de Educación Superior, a través de la suscripción de los instrumentos jurídicos correspondientes;","XXII":"Educación Dual: A la opción educativa a que se refiere el presente instrumento y la cual se define en el artículo 1 del mismo;","XXIII":"Empresa: Unidad económica de producción o distribución de bienes y/o servicios que contribuye con el Estado en la prestación del servicio público educativo mediante la Educación Dual, aportando Puestos de aprendizaje, Infraestructura, personal, capacitación, y que está registrada en la Plataforma de Espacios de Formación Laboral, conforme a lo previsto en los presentes Lineamientos;","XXIV":"Empresa(s) madura(s): Empresa(s) líder(es) en productividad, innovación, mercado y la implementación de la Educación Dual que cuentan con los siguientes criterios: instalaciones adecuadas para las actividades productivas, el Proceso de enseñanza y el Aprendizaje; equipos suficientes para poner en práctica las actividades correspondientes al Plan de rotación; protocolos y una cultura organizacional de no discriminación; con instructores con las cualificaciones y capacidades para llevar a cabo las actividades de formación dentro de la Empresa y están certificados; una cantidad de instructores en concordancia con el número de Puestos de aprendizajes para Estudiantes. Estas empresas proporcionan a las y los Estudiantes: programas para proteger la salud integral; medios de transporte para llegar a las instalaciones de la empresa; brindan alimentación tanto adecuada como saludable y apoyo económico (beca). De manera opcional, pueden contar con un centro de formación;","XXV":"EMS (Educación Media Superior): Tipo educativo que comprende los niveles de bachillerato, de profesional técnico bachiller y los equivalentes a éste, así como la educación profesional que no requiere bachillerato o sus equivalentes;","XXVI":"Escuela(s) y/o plantel(es): Espacio educativo donde se imparte el servicio público de EMS y se construyen el Proceso de enseñanza y el Aprendizaje entre Estudiantes y Docentes, que cuenta con una estructura ocupacional autorizada por la autoridad educativa. Para efectos de estos Lineamientos quedan comprendidas las Escuelas denominadas: i) Centro de Bachillerato Tecnológico Industrial y de Servicios (CBTIS) y Centro de Estudios Tecnológicos Industrial y de Servicios (CETIS), dependientes de la DGETI; ii) Centro de Bachillerato Tecnológico Agropecuario (CBTA), Centro de Bachillerato Tecnológico Forestal (CBTF), Centro de Estudios Tecnológicos en Aguas Continentales (CETAC), Centro de Estudios Tecnológicos del Mar (CETMAR) y Centro Multimodal de Educación Tecnológica del Mar y Aguas Continentales (CMM), dependientes de la DGETAyCM, y iii) Bachilleratos Tecnológicos en Educación y Promoción Deportiva (BTED) dependientes de la DGBTED; que cuentan con Planes y Programas de estudio de EMS que también se imparten bajo la opción de Educación Dual;","XXVII":"Espacio(s) de formación laboral: Empresa o Institución Pública en la que se lleva a cabo el Plan de rotación y la formación de las Competencias laborales básicas y extendidas para Estudiantes que participan en la opción de Educación Dual;","XXVIII":"Estándar(es) de Competencia Laboral: Norma Técnica de Competencia Laboral, que es el documento oficial aplicable en toda la República Mexicana que sirve como referente para evaluar y certificar la competencia laboral de las personas, y que describirá en términos de resultados el conjunto de conocimientos, habilidades, destrezas y actitudes que alude el artículo 83 de la Ley General de Educación y que requiere una persona para realizar actividades en el mercado de trabajo con un alto nivel de desempeño;","XXIX":"Estudiante(s)/Estudiantado: Persona(s) inscrita(s) en la Escuela y cursando un Plan y Programa de estudio de EMS;","XXX":"Gestor(a/es/as) del espacio de formación laboral: Persona(s) capacitada(s) y seleccionada(s) por la Empresa o Institución Pública para dirigir y dar seguimiento de las actividades de Educación Dual. Coordina y gestiona la elaboración y la firma de los Convenios de Colaboración y de Aprendizaje a diferentes niveles;","XXXI":"Infraestructura: Elementos físicos (espacio, instalaciones, equipamiento, herramientas y servicios del inmueble) y tecnológicos (conjunto de software, hardware, redes y servicios conectados que componen el entorno de tecnologías de la información) requeridos para el logro de las Competencias laborales básicas y extendidas de las y los Estudiantes en los Puestos de aprendizaje de la Empresa o Institución Pública;","XXXII":"Instancia(s) Evaluadora(s) y Certificadora(s): Persona moral, organización o Institución Pública o privada, unidad administrativa de alguna dependencia, entidad o su similar en los niveles de Gobierno Federal, Estatal o Municipal, acreditada por el CONOCER para evaluar o certificar las competencias laborales de las personas, con base en Estándares de Competencia Laboral inscritos ante el Registro Nacional de Estándares de Competencia; que tendrá la función de acreditar, previa autorización del CONOCER, a los Centros de Evaluación y/o Evaluadores Independientes en uno o varios Estándares de Competencia Laboral, inscritos en el referido Registro en un periodo determinado;","XXXIII":"Instancia Formadora: Subsistemas que de acuerdo con el ejercicio de sus respectivas competencias son responsables de capacitar y, en su caso, expedir la documentación que acredite dicha capacitación a los Actores de la Educación Dual que lo requieran, con base en el programa de capacitación previamente validado por la SEMS.","XXXIV":"Institución Pública: Entidad cuya función principal es prestar servicios o cumplir objetivos de interés público en sus tres niveles de gobierno (Federal, Estatal/Ciudad de México y Municipal/Demarcaciones Territoriales de la Ciudad de México) mediante recursos, patrimonio y/o financiamientos provenientes de fondos gubernamentales. Estas instituciones incluyen los poderes Ejecutivo, Legislativo y Judicial, órganos constitucionales autónomos, instituciones educativas de carácter público, empresas públicas del Estado y entidades de la administración pública paraestatal, tales como organismos descentralizados, empresas de participación estatal, instituciones de crédito y seguros, fideicomisos, y cualquier otra entidad constituida para atender objetivos de interés general, sujeta a mecanismos de control y supervisión gubernamental;","XXXV":"Institución Pública con infraestructura equiparada: Aquella Institución Pública que, conforme a los Criterios de participación de los Espacios de formación laboral establecidos por la SEMS, puede considerarse similar a una Empresa Madura.","XXXVI":"Instructor(a/es/as): Persona designada por la Empresa o Institución Pública, responsable de orientar el desarrollo de las Competencias laborales (básicas y extendidas) conforme al Plan de rotación, encargado de evaluar y dar seguimiento, en coordinación con el/la Tutor/a académico/a, a las y los Estudiantes con base en dichas Competencias laborales. Esta persona debe estar capacitada por una Instancia Formadora y acreditada (certificada) por una Instancia Evaluadora y Certificadora;","XXXVII":"Matriz de correspondencia: Instrumento que permite identificar la correspondencia de los objetivos de los Puestos de aprendizaje con los resultados de aprendizaje establecidos en los Planes y Programas de estudio. Esta matriz se elabora con la participación de la Escuela y la Empresa o Institución Pública;","XXXVIII":"Mediación digital: Uso de las TICCAD para facilitar la interacción de las y los Estudiantes con las y los Docentes, Docentes facilitadores, Tutoras/es académicas/os e Instructoras/es, así como para la obtención de información relacionada con el Procesos de enseñanza y de Aprendizaje;","XXXIX":"Mediación docente: Intervención profesional de la/del Docente en el Aprendizaje en la Escuela y la Empresa o Institución Pública, de manera presencial y/o con Mediación digital;","XL":"Metas Educativas: Logro que la/el estudiante alcanza a lo largo de su trayectoria académica en determinada asignatura;","XLI":"Organismo(s) del sector empresarial: Persona(s) moral(es) legalmente constituida(s) como Asociaciones, Consejos, Confederaciones Patronales o Cámaras Empresariales, integradas por Empresas que participan en la Educación Dual;","XLII":"Perfil de egreso: Es un horizonte formativo global, que se logra con el aporte de los conocimientos a lo largo de su trayectoria estudiantil en sus diversos semestres. Sus rasgos son una descripción de formas de actuar, pensar y participar en el entorno, deseables en las personas egresadas al término de la EMS, quienes se apropian de los conocimientos, las capacidades y los principios de la Nueva Escuela Mexicana para promover procesos de transformación con justicia social;","XLIII":"Plan de estudio: Es el diseño académico y curricular que organiza, orienta y regula el proceso formativo del Estudiantado en el tipo medio superior conforme a lo establecido en el artículo 29, fracciones I a VI de la Ley General de Educación;","XLIV":"Plan de rotación: Instrumento en el que se programan las actividades a desarrollar por las y los Estudiantes en los Puestos de aprendizaje, los cuales deben estar vinculados a los propósitos académicos, resultados de aprendizaje y desarrollo de Competencias laborales (básicas y extendidas) establecidas en el respectivo Plan y Programa de estudio de EMS, los ámbitos y tiempos de cada una de ellas, así como las evaluaciones y supervisiones correspondientes conforme al calendario de actividades escolares establecido por el Subsistema;","XLV":"Planificación de la Educación Dual: Proceso que se realiza entre la Escuela y la Empresa o la Institución Pública para coordinarse y establecer las bases específicas sobre la impartición de la Educación Dual, conforme al Plan y Programas de estudio, para la elaboración y firma del Convenio de Aprendizaje conforme a los términos establecidos una vez firmado el Convenio de Colaboración;","XLVI":"Plataforma Académica: Espacio de mediación digital administrado por la SEMS, donde cada Estudiante con mediación docente, desarrolla los aprendizajes del currículum fundamental y el currículum ampliado determinados en el respectivo Plan y Programa de estudio de EMS. Forma parte del Sistema de Información de Educación Dual;","XLVII":"Plataforma de Espacios de Formación Laboral: Espacio virtual administrado por la SEMS, el cual propicia la vinculación entre la Escuela y la Empresa, Organismos del Sector Empresarial o Institución Pública, a través del acceso a la información de los Subsistemas, las Escuelas, las/los Responsables de vinculación, los Planes y Programas de estudio de EMS y las/los Instructores. Forma parte del Sistema de Información de Educación Dual;","XLVIII":"Proceso de enseñanza: Mecanismo por el cual una/un Docente transmite y facilita el Aprendizaje en las y los Estudiantes;","XLIX":"Programa de estudio: Integra las metas de aprendizaje, los propósitos y contenidos formativos, las orientaciones didácticas, las secuencias pedagógicas y los criterios de evaluación del Plan de estudio de la EMS, con el fin de garantizar una formación integral, pertinente y progresiva, con perspectiva de género para, desde ello, contribuir a la construcción de una sociedad en donde a las mujeres y hombres se les reconozcan sus derechos y los ejerzan en igualdad de oportunidad, de conformidad con lo establecido en el artículo 29, segundo párrafo de la Ley General de Educación;","L":"Programas de Investigación Científica: Serie ordenada de actividades vinculadas al proceso de construcción de nuevo conocimiento científico, innovador y pertinente que permitan una amplia comprensión y explicación de un tema;","LI":"Puesto(s) de aprendizaje : Espacio formativo dentro de la Empresa o Institución Pública en el cual cada Estudiante, en un tiempo determinado, desarrolla las Competencias laborales (básicas y extendidas) establecidas en el respectivo Plan de estudio de EMS en la opción de Educación Dual, con la supervisión de la persona Instructora y el seguimiento de un/a Tutor/a académico/a;","LII":"Responsable(s) de Educación Dual: Persona designada por la persona servidora pública titular del Subsistema para coordinar y dar seguimiento a la Plataforma de Espacios de Formación Laboral, a la matriculación de Estudiantes en la Plataforma Académica, a la firma de Convenios de Colaboración y Aprendizaje, así como a la capacitación, asesoría y acompañamiento de las Escuelas y los Espacios de formación laboral;","LIII":"Responsable(s) de vinculación: Docente con funciones directivas o frente a grupo, que funge como intermediario entre la Escuela, la Empresa, el Organismo del Sector Empresarial o la Institución Pública, para promover y facilitar la implementación de la Educación Dual;","LIV":"SEP: Secretaría de Educación Pública de la Administración Pública Federal;","LV":"SEMS: Subsecretaría de Educación Media Superior de la SEP;","LVI":"Sistema de Información de la Educación Dual: Espacio digital administrado por la SEMS para mantener un registro de los participantes que forman parte de la Educación Dual en tipo medio superior: Estudiantes, Escuelas, Empresas, Organismos del Sector Empresarial, Instituciones Públicas, Subsistemas, Responsables de Educación Dual, Responsables de vinculación, Instructoras/es y Gestores/as del Espacio de formación laboral. Está compuesto por la Plataforma Académica y la Plataforma de Espacios de Formación Laboral;","LVII":"Subsistema(s): Se refiere a la DGETI, la DGETAyCM y la DGBTED adscritas a la SEMS, que imparten servicios educativos de bachillerato tecnológico conforme a lo dispuesto en el artículo 45, fracción II de la Ley General de Educación y el Marco Curricular Común de la Educación Media Superior vigente;","LVIII":"TICCAD: Tecnologías de la Información, Comunicación, Conocimiento y Aprendizaje Digital;","LIX":"Trayectoria curricular combinada: Orden estructurado en que deberán cursar y acreditarse las asignaturas del componente de formación fundamental. Para el caso de las asignaturas restantes, cada Estudiante tendrá la facultad de elegir el orden en el que las cursarán y acreditarán, y","LX":"Tutor(a) académico(a): Docente responsable del registro de la evaluación de las Competencias laborales (básicas y extendidas) de las y los Estudiantes en el sistema de control escolar del plantel, brindarles acompañamiento, así como mediar en el Aprendizaje y, en coordinación con el/la Instructor/a, dar seguimiento y evaluar a las y los Estudiantes con base en dichas competencias."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI","XXII","XXIII","XXIV","XXV","XXVI","XXVII","XXVIII","XXIX","XXX","XXXI","XXXII","XXXIII","XXXIV","XXXV","XXXVI","XXXVII","XXXVIII","XXXIX","XL","XLI","XLII","XLIII","XLIV","XLV","XLVI","XLVII","XLVIII","XLIX","L","LI","LII","LIII","LIV","LV","LVI","LVII","LVIII","LIX","LX"]},"5":{"t":"Las características de la Educación Dual son:","f":{"I":"El diseño curricular es acorde con lo establecido en el Marco Curricular Común de la Educación Media Superior vigente;","II":"Los aprendizajes del currículum fundamental y el currículum ampliado del Marco Curricular Común de la Educación Media Superior vigente, establecidos en el Plan y Programa de estudio de EMS se desarrollan en la Escuela y en la Plataforma Académica, con mediación docente, mediación digital y estudio independiente;","III":"Las Competencias laborales (básicas y extendidas) se desarrollan en la Empresa o Institución Pública, conforme al respectivo Plan y Programa de estudio de EMS, bajo la supervisión y seguimiento del Instructor/a y del Tutor/a académico/a;","IV":"Los Planes y Programas de estudio de EMS aprobados por la SEMS deberán contar con una Trayectoria curricular combinada;","V":"Se deberá contar con un calendario y horario apegados al escolarizado, pudiendo este último ser flexible en horario matutino y/o vespertino; bajo ningún supuesto o circunstancia podrá aplicarse un horario nocturno que ponga en riesgo la integridad física y mental de las y los Estudiantes. Lo anterior, debe quedar documentado como parte de la Planificación de la Educación Dual y formalizado tanto en el Convenio de Colaboración, como en el Convenio de Aprendizaje;","VI":"Requiere de la suscripción de un Convenio de Colaboración, el cual será el primer instrumento jurídico que dará apertura a la formalización de la Educación Dual;","VII":"El Convenio de Aprendizaje deberá dar seguimiento a la implementación de esta opción educativa, y no podrá celebrarse sin previa firma de un Convenio de Colaboración;","VIII":"La acreditación del Plan y Programa de estudio por parte de la o el Estudiante dependerá de la evaluación que lleve a cabo la Escuela a través de la/del Docente o Docente facilitador y la Empresa o Institución Pública mediante el/la Instructor/a en coordinación con el/la Tutor/a académico/a, para las evaluaciones relativas a las Competencias laborales (básicas y extendidas), conforme a las normas de control escolar que al efecto emita la SEP a través de la Unidad de Asuntos Jurídicos y Regulación;","IX":"Para la emisión de la Doble Certificación, se deberán cumplir los requisitos de acreditación que establezca el Subsistema en coordinación con la COSAC, para el Plan y Programa de estudio correspondiente, conforme a las normas de control escolar que al efecto emita la SEP a través de la Unidad de Asuntos Jurídicos y Regulación;","X":"Para la obtención del Certificado de competencia, al no ser un documento obligatorio, la o el Estudiante deberá cumplir con los requisitos que establezca el CONOCER a través del Organismo Certificador conforme a los Estándares de Competencia Laboral que estén en correspondencia con el respectivo Plan y Programa de estudio de Educación Dual, y","XI":"Toda acción que se implemente, iniciando por los programas de orientación vocacional, el proceso de difusión de la opción educativa y el proceso de selección del Estudiantado incorporará perspectiva de género en aras de aumentar y priorizar la participación de las mujeres en carreras de las áreas de Ciencia, Tecnología, Ingeniería y Matemáticas (STEM, por sus siglas en inglés)."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI"]},"6":{"t":"Los Planes y Programas de estudio de EMS en la opción de Educación Dual, estarán ajustados a lo dispuesto en la Ley General de Educación y al Marco Curricular Común de la Educación Media Superior vigente, promoviendo el desarrollo integral de las y los Estudiantes, sus conocimientos, habilidades, aptitudes, actitudes y Competencias laborales (básicas y extendidas), a través de aprendizajes significativos. En el caso del bachillerato tecnológico, profesional técnico bachiller y tecnólogo, los Planes de estudio favorecerán el desarrollo de los conocimientos, habilidades y actitudes necesarias para alcanzar una vida productiva. Para el caso de las carreras técnicas del área de Ciencias de la salud, el Subsistema deberá solicitar la Opinión Técnico -Académica (OTA) ante la Comisión Interinstitucional para la Formación de Recursos Humanos para la Salud (CIFRHS).","f":{},"o":[]},"7":{"t":"Los Subsistemas, en sus respectivos ámbitos de competencia, propondrán a la persona Titular de la SEMS los Planes y Programas de estudio de EMS en la opción de Educación Dual que se impartirán en las Escuelas, los cuales, una vez aprobados, se difundirán en el Sistema de Información de la Educación Dual.","f":{},"o":[]},"8":{"t":"La Planificación de la Educación Dual deberá asegurar que el periodo de formación de las y los Estudiantes dentro de la Empresa o Institución Pública cumpla con los estándares por carrera y de acuerdo con la temporalidad para el desarrollo de las Competencias laborales (básicas y extendidas) conforme al Plan de rotación.","f":{"I":"Para los campos amplios de formación académica que contemple la Metodología y criterios para la Planificación de la Educación Dual en Media Superior: Ciencias sociales y derecho, Administración y negocios, Artes y Humanidades y Servicios y Educación, el periodo de formación de la/del Estudiante en la Empresa o Institución Pública será de un año a año y medio;","II":"Para los campos amplios de formación académica que contemple la Metodología y criterios para la Planificación de la Educación Dual en Media Superior: Ciencias naturales, Matemáticas y estadísticas, Tecnología de la información y comunicación, Ingeniería, Manufactura y construcción, Agronomía y veterinaria y Ciencias de la salud, el periodo de formación de la/del Estudiante en la Empresa o Institución Pública será un máximo de dos años.","III":"Si la temporalidad del Plan de rotación es menor a dos años, el periodo de formación de las/los Estudiantes dentro de la Empresa o Institución Pública será de 18 horas semanales, que podrá llegar a un máximo de 24 horas semanales en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada, que cuenten con más de 75% en la Matriz de correspondencia para cumplir con el Plan de rotación;","IV":"Si la temporalidad del Plan de rotación es de dos años, durante el primer año el periodo de formación de las/los Estudiantes dentro de la Empresa o Institución Pública será de 18 horas semanales, que podrá llegar a un máximo de 24 horas en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada y que cuenten con más del 75% en la Matriz de correspondencia para cumplir con el Plan de rotación. En el segundo año el periodo de formación de las/los Estudiantes será de 24 horas semanales, que podrá llegar a un máximo de 30 horas semanales en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada y que cuenten con más de 75% en la Matriz de correspondencia para cumplir con el Plan de rotación.","V":"En el caso de carreras de tecnólogos, con duración de 8 semestres, el Plan de rotación podrá ser de hasta tres años de formación en la Empresa o Institución Pública. En el primer año será de 18 horas por semana, que podrá llegar a un máximo de 24 horas en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada y que cuenten con más de 75% en la Matriz de correspondencia para cumplir con el Plan de rotación. En el segundo y el tercer año el periodo de capacitación de las/los Estudiantes en los Espacios de formación laboral será de 24 horas por semana, que podrá llegar a un máximo de 30 horas semanales en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada y que cuenten con más de 75% en la Matriz de correspondencia para cumplir con el Plan de rotación. Cada día en la Empresa o Institución Pública considerará lo siguiente: 6 horas en actividades de formación laboral, 1 hora de estudio en la Plataforma Académica y 1 hora para la comida. En ese sentido: 18 horas semanales de formación laboral equivale a 3 días por semana en la Empresa o Institución Pública; 24 horas equivale a 4 días a la semana en la Empresa o Institución Pública, y 30 horas equivale a 5 días a la semana en la Empresa o Institución Pública. La hora de estudio en la Plataforma Académica y la hora de comida son adicionales a las 6 horas de formación laboral."},"o":["I","II","III","IV","V"]},"9":{"t":"Las Escuelas, en coordinación con las Empresas o Instituciones Públicas, podrán llevar a cabo la Planificación de la Educación Dual observando la Metodología y criterios para la Planificación de la Educación Dual en Media Superior que establezca la SEMS.","f":{},"o":[]},"10":{"t":"La Planificación de la Educación Dual debe apegarse estrictamente al calendario escolar autorizado por la SEMS y aplicado en los Subsistemas sin excepción alguna. Además, deberá establecer un periodo de tres años para la impartición de la Educación Dual, con la finalidad de garantizar la Trayectoria curricular combinada. Si durante el tiempo establecido, se pretende dar por terminada la Educación Dual, la Escuela y la Empresa o Institución Pública tomarán las medidas necesarias a efecto de garantizar la continuidad de los estudios de cada Estudiante en la Escuela.","f":{},"o":[]},"11":{"t":"Las y los Estudiantes con interés en incorporarse a la Educación Dual para la continuación de sus estudios de EMS deberán:","f":{"I":"Estar inscritas/os en una Escuela y haber acreditado las asignaturas correspondientes al primer ciclo escolar del respectivo Plan y Programa de estudio, conforme a la estructura curricular de dicho Plan de la opción de Educación Dual;","II":"En caso de ser menor de edad, contar con el consentimiento expreso, firmado y por escrito, de su madre/padre de familia o tutor legal, para participar en el proceso de selección;","III":"Firmar directamente el Convenio de Aprendizaje. Tratándose de menores de edad, la o el madre/padre de familia o tutor legal serán los responsables de firmar dicho Convenio;","IV":"Desarrollar los aprendizajes del currículum fundamental y currículum ampliado en la Escuela y en la Plataforma Académica, así como el currículum laboral (Competencias laborales básicas y extendidas) en la Empresa o Institución Pública;","V":"Cumplir con las obligaciones a su cargo establecidas en la Metodología y criterios para la Planificación de la Educación Dual en Media Superior que establezca la SEMS, así como en el Convenio de Aprendizaje;","VI":"Manifestar su preferencia por la Empresa o Institución Pública para cursar la Educación Dual, de acuerdo con las Competencias laborales básicas y extendidas expresadas en el Plan y Programa de estudio que previamente el plantel ofertó a través de los mecanismos de convocatoria, para el acompañamiento de la elección de la carrera de interés;","VII":"Participar en las convocatorias de becas correspondientes a la opción de Educación Dual;","VIII":"Sujetarse a las evaluaciones conforme al respectivo Plan y Programa de estudio, y","IX":"Informar a la/al Responsable de vinculación si se encuentra en una situación de vulnerabilidad hacia su persona ante: violencias, acoso sexual, discriminación, racismo, entre otros, tanto en la Escuela como en el Espacio de formación laboral."},"o":["I","II","III","IV","V","VI","VII","VIII","IX"]},"12":{"t":"Las Escuelas deberán:","f":{"I":"Promover la vinculación con las Empresas o Instituciones Públicas;","II":"Difundir oportunamente, entre la comunidad escolar, información respecto a los Planes y Programas de estudio de EMS que imparten bajo la Educación Dual, las convocatorias y el padrón de Empresas e Instituciones Públicas con Convenio de Colaboración suscrito con el objetivo de que las y los Estudiantes con interés puedan incorporarse a la opción educativa a partir del segundo ciclo escolar;","III":"Estar dadas de alta por la SEMS en la Plataforma de Espacios de Formación Laboral;","IV":"Verificar la información de contacto que proporcione la Empresa o Institución Pública, a través de la Plataforma de Espacios de Formación Laboral para establecer comunicación;","V":"Firmar a través del/de la Director/a los Convenios de Aprendizaje correspondientes, y entregar a la/al Responsable de Educación Dual un informe mensual de implementación, fortalecimiento y seguimiento de la Educación Dual;","VI":"Matricular, a través de la/del Responsable de vinculación, a cada Estudiante con el registro de su respectivo Convenio de Aprendizaje en la Plataforma de Espacios de Formación Laboral y en la Plataforma Académica;","VII":"Participar en el proceso de selección de Estudiantes, que serán parte de la Educación Dual en la Empresa o Institución Pública, así como en la formalización del Convenio de Aprendizaje con base en la Metodología y criterios para la Planificación de la Educación Dual en Media Superior que establezca la SEMS;","VIII":"Llevar a cabo la mediación digital a través de la Plataforma Académica, en coordinación con su respectivo Subsistema;","IX":"Implementar mecanismos de supervisión, seguimiento y evaluación de la Educación Dual que imparta;","X":"Designar a las/los Tutoras/es académicos y Docentes facilitadores;","XI":"Materializar la Planificación de la Educación Dual y su adecuada ejecución;","XII":"Garantizar la impartición de la Educación Dual en sus currículums fundamental, ampliado y laboral;","XIII":"Verificar que la/el Estudiante cuente con Seguro Médico Facultativo;","XIV":"Acompañar a la/al Estudiante en el proceso de inscripción de la beca correspondiente a la opción de Educación Dual;","XV":"Cumplir con los principios de igualdad sustantiva, a través del acceso a las y los Estudiantes a mismo trato y oportunidades para el reconocimiento dentro de la opción de Educación Dual;","XVI":"Generar un ambiente libre de violencias, acoso sexual, discriminación, racismo o situación que vulnere a la/al Estudiante, y","XVII":"Las demás que se requieran y acuerden con las Empresas o Instituciones Públicas, para la operación de la Educación Dual y el desarrollo integral del Estudiantado."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII"]},"13":{"t":"Corresponde a los Subsistemas:","f":{"I":"Solicitar opinión al Comité Directivo sobre la conveniencia de diseñar, reorientar y evaluar los Planes y Programas de estudio de EMS en la opción de Educación Dual, acompañando los estudios de factibilidad, prospectiva y pertinencia que justifiquen lo anterior;","II":"Diseñar en términos de las disposiciones aplicables y tomando en cuenta las recomendaciones que, en su caso, emita el Comité Directivo, Planes y Programas de estudio de EMS en la opción de Educación Dual para, de ser el caso proceder, conforme a lo previsto en el artículo 7 de los presentes Lineamientos;","III":"Contar, conforme a las disposiciones jurídicas aplicables, con el personal docente y administrativo, la organización y la infraestructura para brindar el servicio público educativo de EMS en la opción de Educación Dual;","IV":"Brindar la asesoría técnica, seguimiento y apoyo que le requieran sus Escuelas para eficientizar la difusión e impartición de la Educación Dual;","V":"Supervisar que las Escuelas, Empresas o Instituciones Públicas cumplan con lo previsto en los presentes Lineamientos, recomendaciones y demás disposiciones aplicables para la suscripción del Convenio de Colaboración;","VI":"Proponer y obtener la validación de la SEMS, conforme a las disposiciones jurídicas aplicables, respecto de programas y cursos de actualización y capacitación de los Actores de la Educación Dual;","VII":"Ofertar e impartir de manera presencial, virtual o mixta los cursos de actualización y capacitación de los Actores de la Educación Dual de acuerdo con el programa validado por la SEMS;","VIII":"Registrar en el Sistema de Información de Educación Dual la oferta de actualización y capacitación para los Actores de la Educación Dual;","IX":"Expedir a los Actores de la Educación Dual que satisfagan los requisitos establecidos en las disposiciones aplicables, la documentación que acredite la realización y conclusión de los cursos de actualización y capacitación correspondientes;","X":"Proporcionar la orientación y asesoría que requieran, las Escuelas, respecto a los servicios de actualización y capacitación para los Actores de la Educación Dual;","XI":"Estar dados de alta en la Plataforma Académica y en la Plataforma de Espacios de Formación Laboral, para efectos de llevar a cabo la implementación de las acciones administrativas señaladas en las fracciones siguientes de este artículo;","XII":"Acompañar y supervisar a las Escuelas en la matriculación de las y los Estudiantes, así como en el registro de sus Convenios de Aprendizaje en el Sistema de Información de Educación Dual, a través de la/del Responsable de Educación Dual;","XIII":"Recibir a través de la Plataforma de Espacios de Formación Laboral las solicitudes de las Empresas o Instituciones Públicas para validar su registro y vinculación con las Escuelas;","XIV":"Celebrar previa anuencia de la SEMS el Convenio de Colaboración con la Empresa, Institución Pública u Organismo del Sector Empresarial para dar inicio a la implementación de la Educación Dual, el cual debe remitir a la SEMS en un máximo de 30 días hábiles posterior a la firma;","XV":"Dar seguimiento y verificar el cumplimiento de los Convenios de Colaboración;","XVI":"Dar seguimiento y verificar a través de la/del Responsable de Educación Dual y de la/del Responsable de vinculación, que los Convenios de Aprendizaje se apeguen a lo previsto en los presentes Lineamientos;","XVII":"Llevar el registro de las evaluaciones de las y los Estudiantes para dar seguimiento a su Trayectoria curricular combinada, conforme a las normas de control escolar que emita la SEP a través de la Unidad de Asuntos Jurídicos y Regulación. Dicho registro deberá estar actualizado permanentemente y permitir su articulación con el Sistema de Información de Educación Dual;","XVIII":"Garantizar a través del Convenio de Aprendizaje que las y los Estudiantes cuenten con seguridad médica ampliada que les proteja en caso de accidente u otra eventualidad en el desarrollo de actividades dentro de la Empresa o Institución Pública, así como en sus traslados;","XIX":"Informar trimestralmente a la SEMS las acciones de implementación, fortalecimiento y seguimiento en la Educación Dual, incluyendo un reporte sobre los Convenios de Colaboración celebrados y los Convenios de Aprendizaje formalizados por las Escuelas;","XX":"Cumplir con los principios de igualdad sustantiva, permitiendo el acceso a las y los Estudiantes a una paridad de trato y oportunidades para el reconocimiento dentro de la Educación Dual;","XXI":"Garantizar a las y los Estudiantes que se encuentren en esta opción de Educación Dual el acceso a la beca correspondiente, y","XXII":"Generar un ambiente libre de violencias, acoso sexual, discriminación, racismo o situación que vulnere a las y los Estudiantes."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI","XXII"]},"14":{"t":"Las Empresas e Instituciones Públicas que deseen participar en la Educación Dual como Espacios de formación laboral, deberán:","f":{"I":"En el caso de las Empresas estar legalmente constituidas como personas morales de conformidad con la normativa aplicable y cumplir con los Criterios de participación de los Espacios de formación laboral establecidos por la SEMS;","II":"Suscribir a través de su representante legal el Convenio de Colaboración;","III":"Registrarse en la Plataforma de Espacios de Formación Laboral;","IV":"Seleccionar en el Sistema de Información de Educación Dual el(los) Plan(es) y Programa(s) de estudio de EMS en la opción de Educación Dual en los que pretende participar, mismos que deberán ser afines y compatibles con las actividades que lleva a cabo conforme a su objeto social o su función;","V":"Definir, con base en lo señalado en la fracción IV que antecede, el perfil de las/los Estudiantes requerido para los Puestos de aprendizaje;","VI":"Contar con la Infraestructura, Instructoras/es capacitados por una Instancia Formadora y acreditados (certificados) por una Instancia Evaluadora y Certificadora, materiales suficientes, y la estructura organizacional necesaria para participar e impulsar la Educación Dual; así como contar con al menos el 75% de la Matriz de correspondencia para cumplir con el Plan de rotación;","VII":"Indicar en la Plataforma de Espacios de Formación Laboral, los Puestos de aprendizaje disponibles para el establecimiento de los Planes de rotación, conforme al respectivo Plan y Programa de estudio de la opción de Educación Dual;","VIII":"Registrar en la Plataforma de Espacios de Formación Laboral a las/los Instructoras/es;","IX":"Participar, con la Escuela en el proceso de selección de las y los Estudiantes que serán parte de la Educación Dual en la Empresa o Institución Pública, así como en la formalización del Convenio de Aprendizaje, con base en la Metodología y criterios para la Planificación de la Educación Dual en Media Superior que establezca la SEMS;","X":"Cumplir con las obligaciones a su cargo establecidas en el Convenio de Colaboración, así como en los Convenios de Aprendizaje;","XI":"Contratar seguro médico ampliado para Estudiantes que realizan su Aprendizaje en los Espacios de formación laboral, adicional al Seguro Médico Facultativo, que tenga por objeto protegerles en caso de un accidente u otra eventualidad en la Empresa o Institución Pública, así como en sus traslados;","XII":"Proporcionar al Estudiantado programas de protección a la salud integral; facilitar los desplazamientos de la Escuela a la Empresa o a la Institución Pública y de éstas últimas a su hogar, así como brindar un apoyo para la alimentación adecuada y saludable. Lo anterior, de acuerdo con las necesidades particulares de cada Estudiante y a las capacidades de los Espacios de formación laboral;","XIII":"Facilitar la certificación de Instructoras/es, para acreditar un determinado Estándar de Competencia Laboral para la implementación de la Educación Dual;","XIV":"Facilitar la obtención del Certificado de competencia correspondiente a las y los Estudiantes interesados que cursen la Educación Dual en dicho Espacio de formación laboral; la obtención del certificado antes referido no será obligatoria para la/el estudiante;","XV":"Cumplir con los principios de igualdad sustantiva, permitiendo el acceso a las y los Estudiantes a una paridad de trato y oportunidades para el reconocimiento dentro de la Educación Dual, y","XVI":"Generar un ambiente libre de violencias, acoso sexual, discriminación, racismo o situación que vulnere a las y los Estudiantes."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI"]},"15":{"t":"Corresponde a las Instancias Evaluadoras y Certificadoras:","f":{"I":"Proporcionar la orientación y asesoría que requieran las Empresas, los Organismos del Sector Empresarial y las Instituciones Públicas para la evaluación de las/los Instructoras/es, y","II":"Proporcionar la orientación y asesoría a Instructoras/es para obtener la certificación ante el CONOCER que acredite el Estándar de Competencia Laboral determinado."},"o":["I","II"]},"16":{"t":"Los Organismos del Sector Empresarial para promover y facilitar la participación de sus Empresas afiliadas en la Educación Dual podrán celebrar Convenios de Colaboración. Dichos Organismos deberán solicitar a la SEMS su acceso a la Plataforma de Espacios de Formación Laboral para facilitar y monitorear la impartición de la Educación Dual entre sus afiliados.","f":{},"o":[]},"17":{"t":"Con la finalidad de impulsar, fortalecer y promover la Educación Dual en México, la SEP por medio de la SEMS establecerá vínculos con los gobiernos de otras naciones y organismos internacionales con la colaboración de la Secretaría de Relaciones Exteriores a través de la Agencia Mexicana de Cooperación Internacional para el Desarrollo (AMEXCID). La acción que antecede será implementada a través de los instrumentos jurídicos correspondientes.","f":{},"o":[]},"18":{"t":"Se establece el Comité Directivo, como un órgano colegiado de apoyo técnico de la SEP, que tendrá por objeto coordinar y articular las estrategias y las acciones para la implementación, desarrollo y consolidación de la Educación Dual.","f":{},"o":[]},"19":{"t":"El Comité Directivo estará integrado por:","f":{"I":"La persona Titular de la SEMS, quien lo presidirá;","II":"La persona Titular de la COSAC;","III":"La persona Titular de la DGETI;","IV":"La persona Titular de la DGETAyCM;","V":"La persona Titular de la DGBTED;","VI":"La persona Titular de la DGCFT;","VII":"La persona Titular de la Coordinación de ODES de Colegios de Estudios Científicos y Tecnológicos (CECyTEs), adscrita a la DGETI;","VIII":"La persona Titular del Colegio Nacional de Educación Profesional Técnica (CONALEP);","IX":"La persona Titular del Centro de Enseñanza Técnica Industrial (CETI);","X":"La persona Titular del CONOCER;","XI":"Hasta cuatro personas representantes del sector Empresarial;","XII":"Una persona representante de las Instituciones Públicas que participan como Espacios de formación laboral. Las personas integrantes del Comité Directivo referidas en las fracciones I a XII tendrán derecho a voz y voto, asistirán y participarán en las sesiones del mismo. Asimismo, designarán por escrito a su suplente, mismo que deberá tener el nivel jerárquico inmediato inferior al de aquéllos. La(el) Presidenta(e) del Comité Directivo formalizará la invitación a las personas enunciadas en las referidas fracciones VIII a XII para que formen parte del mismo. El Comité Directivo contará con una persona que fungirá como Secretaria(o) Técnica(o) designada por su Presidenta(e) quien asistirá a las sesiones con derecho a voz, pero sin voto. De igual manera, a las sesiones del Comité Directivo podrán asistir con carácter de invitados especiales, con derecho a voz, pero no a voto, representantes de otras instituciones de los sectores públicos en los niveles Federal, Estatal/Ciudad de México y Municipal/Demarcación Territorial de la Ciudad de México, social y privado nacionales o extranjeros; además de otras instituciones que pertenezcan al Sistema Educativo Nacional, cuya participación se considere necesaria para impulsar la Educación Dual."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"]},"20":{"t":"El Comité Directivo tendrá las siguientes funciones:","f":{"I":"Aprobar sus normas de organización y funcionamiento;","II":"Coordinar la implementación y consolidación de la Educación Dual;","III":"Emitir opinión, con base en los estudios de factibilidad, prospectiva y pertinencia que sean sometidos a su consideración por los Subsistemas, sobre la conveniencia de diseñar, reorientar y evaluar los Planes y Programas de estudio de EMS en la opción de Educación Dual;","IV":"Formular recomendaciones a los Subsistemas para el diseño curricular de los Planes y Programas de estudio de EMS que se pretendan impartir mediante la Educación Dual;","V":"Evaluar la implementación de la Educación Dual de manera científica;","VI":"Formular recomendaciones a las Escuelas, Subsistemas y Espacios de formación laboral, para mejorar la operación de la Educación Dual;","VII":"Acordar estrategias y acciones para promover el impulso y la difusión de la Educación Dual;","VIII":"Establecer, en su caso, grupos de trabajo de carácter permanente o transitorio, que sirvan de apoyo al Comité Directivo, para la implementación, seguimiento y evaluación de la Educación Dual;","IX":"Emitir recomendaciones a la SEMS sobre la Metodología y criterios para la Planificación de la Educación Dual en Media Superior;","X":"Fomentar Programas de Investigación Científica sobre la implementación de la Educación Dual, y","XI":"Las demás que resulten necesarias para el cabal cumplimiento de su objeto."},"o":["I","II","III","IV","V","VI","VII","VIII","IX","X","XI"]},"21":{"t":"Las sesiones del Comité Directivo serán convocadas por su Secretaria(o) Técnica(o), a indicaciones de su Presidenta(e), con por lo menos diez días hábiles de anticipación tratándose de sesiones ordinarias y cinco días hábiles en el caso de las extraordinarias. El Comité Directivo celebrará al menos dos sesiones ordinarias al año y las extraordinarias tantas veces como sea necesario. Las sesiones ordinarias y extraordinarias del Comité Directivo serán de carácter preferentemente presencial y excepcionalmente en modalidad virtual o mixta, conforme lo que se determine en las normas de organización y funcionamiento del Comité Directivo. Con la convocatoria a la sesión respectiva, su Secretaria(o) Técnica(o) deberá remitir el orden del día y la documentación que soporte los temas a tratar en la sesión correspondiente. Para la validez de las sesiones del Comité Directivo, será necesario tener un quórum de la mitad de sus integrantes más uno. El Comité Directivo tomará sus acuerdos por mayoría de votos de sus miembros presentes en la sesión de que se trate. En caso de empate, quien lo presida tendrá voto de calidad. Las personas integrantes del Comité Directivo no recibirán retribución, emolumento o compensación alguna por su participación en éste.","f":{},"o":[]},"22":{"t":"Por cada Organismo del Sector Empresarial, Empresa o Institución Pública que se incorpore a la Educación Dual, la SEMS o el Subsistema, con anuencia de la SEMS, debe suscribir un Convenio de Colaboración, el cual se celebrará para iniciar la implementación de la Educación Dual, mismo que deberá establecer al menos lo siguiente:","f":{"I":"Las bases de implementación para las Competencias laborales básicas y extendidas dentro del Espacio de formación laboral;","II":"Los compromisos y las obligaciones por cada una de las partes involucradas para el cumplimiento de los presentes Lineamientos, y","III":"La vigencia, que será de dos años a partir de su formalización por primera vez, la cual podrá extenderse hasta tres años en el caso de Empresas maduras o Instituciones Públicas con infraestructura equiparada, e inclusive hasta cuatro años en el caso de carreras de tecnólogos con duración de 8 semestres."},"o":["I","II","III"]},"23":{"t":"Para la celebración del Convenio de Colaboración, el Organismo del Sector Empresarial, la Empresa o la Institución Pública deberán presentar los siguientes requisitos documentales mínimos, los cuales formarán parte como Anexo del referido Convenio: a) Acta Constitutiva del Organismo del Sector Empresarial o de la Empresa como persona moral. Para el caso de Institución Pública será el instrumento normativo que crea o regula a la misma; b) Constancia de Situación Fiscal actualizada; c) Instrumento notarial en donde se acredite fehacientemente la personalidad jurídica de la/del Apoderada/o o Representante Legal del Organismo del Sector Empresarial o de la Empresa que suscribe el Convenio de Colaboración, en caso de que dicha representación no conste en el Acta Constitutiva. En el caso de Institución Pública el instrumento normativo por el que se le otorgue la representación legal a la persona que suscribe el Convenio de Colaboración o, de ser el caso, el instrumento notarial correspondiente, y d) Cualquier otro que determine la SEP a través de la SEMS.","f":{},"o":[]},"24":{"t":"Los Convenios de Colaboración deberán ser registrados por la/el Responsable de Educación Dual, en el Sistema de Información de la Educación Dual a través de la Plataforma de Espacios de Formación Laboral, en un plazo no mayor a 30 días hábiles contados a partir de la fecha de su firma.","f":{},"o":[]},"25":{"t":"La SEMS podrá indicar a los Subsistemas que lleven a cabo las acciones necesarias para la terminación anticipada de los Convenios de Colaboración suscritos por ellos, en el caso de que detecte que dichos instrumentos jurídicos no cumplen con los criterios establecidos en los presentes Lineamientos.","f":{},"o":[]},"26":{"t":"Por cada Estudiante que se incorpore a la Educación Dual, se deberá suscribir un Convenio de Aprendizaje entre la Escuela, el Espacio de formación laboral, la o el Estudiante y, en su caso, con la o el madre/padre de familia o tutor legal, como parte de la Planificación de Educación Dual, mismo que deberá establecer, al menos, lo siguiente:","f":{"I":"Calendario, horario, periodos vacacionales y número de horas semanales en las que la o el Estudiante podrá realizar su aprendizaje, para el desarrollo de las Competencias laborales (básicas y extendidas), en la Empresa o Institución Pública;","II":"La vigencia, la cual podrá ser desde un año y hasta dos años en atención a las carreras según los campos amplios de formación establecidos en el artículo 8 de estos Lineamientos, e incluso hasta tres años en el caso de carreras de tecnólogos con duración de 8 semestres;","III":"Matriz de correspondencia;","IV":"Plan de rotación con los Puestos de aprendizaje correspondientes;","V":"De manera precisa los apoyos, mecanismos de protección y cuidados para la o el Estudiante tales como: la afiliación obligatoria al Instituto Mexicano del Seguro Social a través del Seguro Médico Facultativo por parte de la Escuela; un seguro médico ampliado por parte de las Empresas o Instituciones Públicas, y","VI":"Adicionalmente, otros mecanismos que la Escuela y la Empresa o Institución Pública consideren necesarios para mejorar el proceso formativo: transporte, uniforme, equipo u herramienta de trabajo, acceso a equipo de cómputo para actividades académicas."},"o":["I","II","III","IV","V","VI"]},"27":{"t":"Para la celebración del Convenio de Aprendizaje, los Espacios de formación laboral deberán presentar los siguientes requisitos documentales mínimos, los cuales formarán parte como Anexo del referido Convenio: a) Acta Constitutiva de la Empresa como persona moral. Para el caso de Institución Pública será el instrumento normativo que crea o regula la misma; b) Constancia de Situación Fiscal actualizada; c) Instrumento notarial en donde se acredite fehacientemente la personalidad jurídica de la/del Apoderada/o o Representante Legal de la Empresa, que suscribe el Convenio de Aprendizaje, en caso de que dicha representación no conste en el Acta Constitutiva. En el caso de Institución Pública el instrumento normativo por el que se le otorgue la representación legal a la persona que suscribe el Convenio de Aprendizaje o, de ser el caso, el instrumento notarial correspondiente, y d) Cualquier otro que determine la SEP a través de la SEMS.","f":{},"o":[]},"28":{"t":"Los Convenios de Aprendizaje deberán ser registrados por la/el Responsable de vinculación, en el Sistema de Información de la Educación Dual, en un plazo no mayor a 30 días hábiles contados a partir de la fecha de su firma.","f":{},"o":[]},"29":{"t":"El Convenio de Aprendizaje será válido en tanto haya un Convenio de Colaboración formalizado y vigente.","f":{},"o":[]},"30":{"t":"La SEP, a través de la SEMS, deberá poner a disposición de las/los usuarios a que refieren las fracciones XLVI y XLVII del artículo 4 de estos Lineamientos, el uso del Sistema de Información de la Educación Dual, conformado por la Plataforma Académica y la Plataforma de Espacios de Formación Laboral, el cual facilitará la Planificación de la Educación Dual.","f":{},"o":[]},"31":{"t":"Para efectos de la operación del Sistema de Información de la Educación Dual, se deberán cumplir las disposiciones jurídicas en materia de tecnologías de la información y comunicación vigentes.","f":{},"o":[]}}, BIB={"n":79,"ident":170,"uniq":121,"oa":75,"bn":4,"ex":46,"lv":{"M":13,"S":35,"C":11,"E":20},"years":[{"y":2013,"E":0,"S":0,"M":1,"C":0},{"y":2014,"E":0,"S":0,"M":0,"C":0},{"y":2015,"E":0,"S":1,"M":0,"C":0},{"y":2016,"E":0,"S":2,"M":1,"C":0},{"y":2017,"E":0,"S":2,"M":0,"C":1},{"y":2018,"E":1,"S":1,"M":0,"C":1},{"y":2019,"E":0,"S":9,"M":1,"C":1},{"y":2020,"E":0,"S":4,"M":1,"C":5},{"y":2021,"E":0,"S":3,"M":3,"C":1},{"y":2022,"E":1,"S":0,"M":2,"C":2},{"y":2023,"E": const romanN=s=>[...s].reduce((n,c,i,a)=>n+(RN[c]<(RN[a[i+1]]||0)?-RN[c]:RN[c]),0);
function artRefs(t){const out=[];let cur=null;t.split(/,\s*/).forEach(tok=>{let m=tok.match(/^(\d+) (a|y) (\d+)$/);
 if(m){for(let i=+m[1];i<=+m[3];i++)out.push({a:String(i)});return}
 m=tok.match(/^(\d+)?\s*([IVXL]+)?(?:-([IVXL]+))?$/);if(!m)return;if(m[1])cur=m[1];
 if(m[2]&&m[3]){const o=ART[cur].o;o.slice(o.indexOf(m[2]),o.indexOf(m[3])+1).forEach(f=>out.push({a:cur,f}))}else out.push({a:cur,f:m[2]})});return out}
function openArt(t){const d=document.getElementById('artd'),r=artRefs(t);
 d.querySelector('#artb').innerHTML=r.map(x=>{const A=ART[x.a];if(!A)return '';
  const body=x.f?`<blockquote>${A.f[x.f]||''}</blockquote>`:`<blockquote>${A.t}</blockquote>${A.o.map(k=>`<blockquote><b>${k}.</b> ${A.f[k]}</blockquote>`).join('')}`;
  return `<h3>Artículo ${x.a}${x.f?`, fracción ${x.f}`:''}</h3>${x.f?`<p class="small muted">La fracción es un inciso del artículo, numerado en romanos. ${x.f} equivale a ${romanN(x.f)}.</p>`:''}${body}`}).join('');
 d.showModal();}

function hoursPlan(c,d,mat,mad){
 if(mat<75)return{block:true,years:[]};
 const up=mad&&mat>75;
 const low=up?24:18, high=up?30:24;
 if(c==='tec')return{years:[low,high,high],up};
 if(c==='g1'||d==='m')return{years:[low],partial:c==='g1',up};
 return{years:[low,high],up};
}

 const r=hoursPlan(c,d,mat,mad),o=$('#h-out');
 if(r.block){o.innerHTML=`<div class="note">${ic('circle-x')}<span><b>No alcanza el mínimo.</b> Con ${mat} % esta empresa no puede participar: se requiere al menos 75 % de la matriz. ${art('14 VI')}</span></div>`;return}
 const dayN=h=>h/6, wk=['L','M','M','J','V'];
 const label=(y,i)=>c==='g1'?'1 a 1.5 años':(c==='g2'&&d==='m')?'Menos de 2':`Año ${i+1}`;
 const say=r.years.map((h,i)=>`${r.years.length>1?`año ${i+1}: `:''}${h} horas, ${dayN(h)} días por semana`).join('; ');
 const hint=r.up?'Se aplica la carga máxima porque la empresa es madura y supera el 75 %.':mad?'Para la carga máxima no basta el 75 % exacto: el Acuerdo pide más de 75 %.':mat>75?'Se aplica la carga base. Las horas máximas también exigen empresa madura o institución equiparada.':'Se aplica la carga base. Las horas máximas piden más de 75 % y empresa madura o institución equiparada.';

 <div class="legendline" style="margin-top:8px"><span><i class="dot" style="--g:var(--g-emp)"></i>Espacio laboral</span><span><i class="dot" style="--g:var(--g-esc)"></i>Escuela</span><span>${r.up?'Carga máxima':'Carga base'}</span></div>

function convCheck(cc,ca,start){const end=start+ca,gap=Math.max(0,end-cc);return{end,gap,ok:gap===0}}
function calcConv(){
 fillCA();
 const cc=+$('#c-t').value,ca=+$('#c-a').value,st=+$('#c-s').value;
 $('#c-so').textContent=st;
 const r=convCheck(cc,ca,st),M=Math.max(54,r.end+2),W=560,L=118,R=14,x=m=>L+(W-L-R)*m/M;
 const rows=[['Planificación',0,36,'--g-sub'],['Colaboración',0,cc,'--g-gob'],['Aprendizaje',st,Math.min(r.end,cc),'--g-esc']],last=cc-ca,yr=n=>n===12?'1 año':(n/12)+' años';
 let g='';
 for(let m=0;m<=M;m+=12)g+=`<line x1="${x(m)}" x2="${x(m)}" y1="10" y2="124" stroke="var(--line)"/><text x="${x(m)}" y="140" font-size="11" text-anchor="middle" opacity=".75">${yr(m)}</text>`;

  }
 }
 f.append(t.slice(i));n.replaceWith(f);
}
function siglas(r){
 const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),L=[];
 while(w.nextNode())L.push(w.currentNode);
 L.forEach(sgText);
 r.querySelectorAll('svg text').forEach(e=>{const m=e.textContent.match(SGR);if(m&&!e.querySelector('title')){const k=document.createElementNS('http://www.w3.org/2000/svg','title');k.textContent=m.map(s=>s+': '+GL[s]).join('. ');e.append(k)}});
}
const sgo=new MutationObserver(ms=>{sgo.disconnect();
 ms.forEach(m=>m.addedNodes.forEach(n=>{if(!n.isConnected)return;if(n.nodeType===1)siglas(n);else if(n.nodeType===3)sgText(n)}));
 sgStart()});
const sgStart=()=>sgo.observe(document.body,{childList:true,subtree:true});
const sgtip=document.createElement('div');sgtip.id='sgtip';sgtip.setAttribute('role','tooltip');sgtip.hidden=true;

function sgShow(a){

 const host=a.closest('dialog')||document.body;if(sgtip.parentNode!==host)host.append(sgtip);

 const r=a.getBoundingClientRect(),W=document.documentElement.clientWidth,H=innerHeight,w=sgtip.offsetWidth,h=sgtip.offsetHeight;
 sgtip.style.left=Math.max(8,Math.min(r.left,W-w-8))+'px';
 sgtip.style.top=(r.bottom+h+10>H?Math.max(8,r.top-h-6):r.bottom+6)+'px';
}
document.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('abbr.sg');if(a)sgShow(a)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('abbr.sg')&&document.activeElement!==e.target)sgHide()});
document.addEventListener('focusin',e=>{if(e.target.matches('abbr.sg'))sgShow(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('abbr.sg'))sgHide()});
document.addEventListener('click',e=>{const a=e.target.closest('abbr.sg');a?sgShow(a):sgHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sgHide()});
addEventListener('scroll',sgHide,{passive:true,capture:true});
siglas(document.body);document.body.append(sgtip);sgStart();
drawLinks();
