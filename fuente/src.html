<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Educación Dual EMS: mapa y diagnóstico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idea de layout: dos sedes de aprendizaje. Azul = escuela, naranja = espacio laboral.
   El color nombra siempre al grupo de actores; la franja dual recorre toda la página. */
:root{
  color-scheme:light;
  --bg:#f3f5f7;--surface:#ffffff;--surface2:#e9eef2;--ink:#0f1a26;--ink2:#4a5a6c;--line:#d5dde5;
  --g-esc:#2a78d6;--g-emp:#eb6834;--g-sub:#1baf7a;--g-est:#eda100;--g-gob:#e87ba4;--g-apo:#8391a1;
  --s-a:#7b8794;--s-b:#6250d6;
  --ok:#14804a;--warn:#a86a00;--bad:#c5302e;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10161d;--surface:#18202a;--surface2:#222c38;--ink:#eef2f6;--ink2:#a9b6c5;--line:#2f3b49;
  --g-esc:#3987e5;--g-emp:#d95926;--g-sub:#199e70;--g-est:#c98500;--g-gob:#d55181;--g-apo:#7f8d9c;
  --s-a:#94a0ad;--s-b:#9085e9;--ok:#46c07f;--warn:#e0a63a;--bad:#f07a78;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161d;--surface:#18202a;--surface2:#222c38;--ink:#eef2f6;--ink2:#a9b6c5;--line:#2f3b49;
  --g-esc:#3987e5;--g-emp:#d95926;--g-sub:#199e70;--g-est:#c98500;--g-gob:#d55181;--g-apo:#7f8d9c;
  --s-a:#94a0ad;--s-b:#9085e9;--ok:#46c07f;--warn:#e0a63a;--bad:#f07a78;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px)}
h3{font-size:17px}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g-esc);outline-offset:2px;border-radius:4px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.dualbar{height:5px;background:linear-gradient(90deg,var(--g-esc) 0 50%,var(--g-emp) 50% 100%)}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand span{color:var(--ink2);font-size:13px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:9px 12px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:26px 20px 56px}
section.view{display:flex;flex-direction:column;gap:26px}
section.view[hidden]{display:none}
.lead{display:flex;flex-direction:column;gap:5px;max-width:800px}
.lead p{color:var(--ink2);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card>h3{margin-bottom:12px;display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.art{font:500 11.5px/1.3 var(--mono);color:var(--ink2);background:var(--surface2);padding:1px 6px;border-radius:4px;white-space:nowrap}
a.src{font-size:11.5px;line-height:1.3;color:var(--ink2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;text-decoration:none;white-space:nowrap}
a.src:hover{color:var(--ink);border-color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--g,var(--ink2)) 16%,var(--surface));white-space:nowrap}
.tag .dot,.dot{width:8px;height:8px;border-radius:50%;background:var(--g,var(--ink2));display:inline-block;flex:none}

/* Resumen */
.formula{display:grid;grid-template-columns:1fr 34px 1fr 42px 1.15fr;gap:10px;align-items:stretch}
.fbox{border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--g) 11%,var(--surface));border-top:4px solid var(--g);display:flex;flex-direction:column;gap:6px}
.fbox .ic{width:30px;height:30px}
.fbox b{font-family:var(--display);font-size:18px}
.fop{display:grid;place-items:center;font:700 26px var(--display);color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:3px}
.tile .ic{color:var(--ink2)}
.tile b{font:700 27px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--ink2)}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.find{display:flex;flex-direction:column;gap:7px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);text-decoration:none}
.find.warn{border-left-color:var(--warn)}
.find:hover{border-color:var(--ink2);border-left-color:var(--bad)}
.find.warn:hover{border-left-color:var(--warn)}
.find b{font-size:15px;line-height:1.3}
.find small{color:var(--ink2);font-size:13px}
.find i{font-style:normal;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:auto}
.chap{display:flex;flex-wrap:wrap;gap:6px}
.chap button{border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:8px;display:flex;gap:7px;align-items:center;font-weight:500}
.chap button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chapd{margin-top:12px;padding:12px 14px;background:var(--surface2);border-radius:8px;display:flex;gap:10px;flex-direction:column;min-height:92px}
.tl{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding-top:14px}
.tl:before{content:"";position:absolute;left:0;right:0;top:19px;height:2px;background:var(--line)}
.tlp{position:relative;padding-top:18px;display:flex;flex-direction:column;gap:3px}
.tlp:before{content:"";position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--surface)}
.tlp.pend:before{background:var(--warn)}
.tlp b{font-size:13.5px}
.tlp span{font-size:12.5px;color:var(--ink2)}

.art{border:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.art:hover{background:var(--ink);color:var(--surface)}
.tile>.art,.tile>span>.art{align-self:flex-start}
.demo{font:500 11.5px var(--mono);background:var(--surface2);padding:1px 6px;border-radius:4px;white-space:nowrap}
.howto{display:flex;gap:9px;align-items:flex-start;padding:10px 13px;border-radius:8px;border:1px dashed var(--ink2);font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rules .tile b{font-size:24px}
.rules .tile small{font-size:12.5px;color:var(--ink2)}
.rules .tile{gap:4px}
.rules .tile>span:last-child{margin-top:auto;padding-top:4px}
.asks{border-top:4px solid var(--g);padding:14px}
.plat{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px}
.platd{display:flex;flex-direction:column;gap:8px}
.platn{display:flex;flex-direction:column;gap:8px}
.platn .tile{padding:9px 12px}
.platn .tile b{font-size:22px}
.platd .pills{align-items:center}
.small-op{font-size:18px}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow span{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 9px;background:var(--surface2);border-radius:7px}
.flow em{font:600 11px var(--mono);font-style:normal;color:var(--ink2)}
a.go{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:auto;text-decoration:none}
a.go:hover{text-decoration:underline}
.origin{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.origin span{display:flex;gap:6px;align-items:center}
.plain{font-size:15px;font-weight:500}
.lab .ic{width:1.1em;height:1.1em;vertical-align:-.2em}
.note.ev{background:color-mix(in srgb,var(--s-b) 12%,var(--surface))}
.glos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.glos>div{display:flex;flex-direction:column;gap:3px;font-size:13.3px}
.glos b{font-size:14px}
.glos .ic{color:var(--ink2)}
.sblock{display:flex;flex-direction:column;gap:5px}
.sblock .lab{margin:7px 0 0}
.sblock .lab:first-child{margin-top:0}
.sttl{font-size:21px;margin:0}
.sblock .chips{margin-top:7px}
.sblock .note{margin-top:9px}
.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.prisma{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.prisma>.ic{align-self:center;color:var(--ink2)}
.prisma>div{flex:1 1 150px;background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.prisma b{font:700 25px var(--display)}
.prisma span{font-size:12.8px;color:var(--ink2)}
.prisma .hi{background:color-mix(in srgb,var(--s-b) 16%,var(--surface))}
.bar.wide{grid-template-columns:150px 1fr 26px}
.bar.wide2{grid-template-columns:185px 1fr 26px}
.xb{display:grid;grid-template-columns:90px 22px;gap:6px;align-items:center}
.xb i{display:block;height:11px;background:var(--s-a);border-radius:0 3px 3px 0;min-width:1px;max-width:90px}
.xb.e i{background:var(--s-b)}
.xt .status{font-size:12px;padding:1px 8px;white-space:nowrap}
.tops{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.3px}
.tops li{display:grid;grid-template-columns:32px 1fr;gap:6px}
.tops b{font:700 17px var(--display)}
dialog#artd{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:18px;width:min(640px,calc(100vw - 32px));max-height:80vh}
dialog#artd::backdrop{background:rgba(10,15,22,.55)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.dh>div{display:flex;flex-direction:column}
#artb{display:flex;flex-direction:column;gap:7px}
#artb blockquote{margin:0;padding:9px 12px;background:var(--surface2);border-radius:7px;font-size:14px}

/* Actores */
.actors{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
.net{position:relative;display:flex;flex-direction:column;gap:10px}
.net svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.lane{background:color-mix(in srgb,var(--g) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--g) 32%,var(--line));border-radius:var(--r);padding:9px}
.lane h3{font-size:12.5px;font-family:var(--body);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.nodes{display:flex;flex-wrap:wrap;gap:7px}
.mid{display:grid;grid-template-columns:1.25fr .72fr 1fr;gap:10px}
.mid .nodes{flex-direction:column}
.node{position:relative;z-index:3;max-width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-weight:500;font-size:13.5px;line-height:1.2;transition:opacity .15s}
.node .ic{color:var(--g)}
.node:hover{border-color:var(--ink2)}
.node[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.node[aria-pressed="true"] .ic{color:var(--surface)}
.node.dim{opacity:.5}
.node .relnum{margin-left:auto}
.node.rel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.panel{position:sticky;top:112px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 128px);overflow:auto}
.ph{display:flex;gap:11px;align-items:center}
.ph .bigic{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--g) 20%,var(--surface))}
.ph h3{font-size:19px;margin:0}
.lab{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:4px}
.do{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.do li{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.do li .ic{color:var(--ink2);align-self:center}
.relnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11.5px;font-weight:600;flex:none}
.note{padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:13.5px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.legendline{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legendline span{display:flex;align-items:center;gap:5px}

/* Procesos */
.phases{display:grid;grid-template-columns:3fr 4fr 2fr;gap:10px}
.phase{display:flex;flex-direction:column;gap:6px;min-width:0}
.phase h3{font-size:12.5px;font-family:var(--body);font-weight:600;color:var(--ink2);padding-bottom:4px;border-bottom:2px solid var(--line)}
.steps{display:flex;gap:6px}
.step{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:12px;line-height:1.2;font-weight:500}
.step .ic{width:22px;height:22px}
.step em{font:600 11px var(--mono);color:var(--ink2)}
.step[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.step[aria-pressed="true"] em{color:var(--surface)}
.stepd{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:22px}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--ink2);font-weight:600}
tbody tr.on{background:var(--surface2)}
tbody tr[data-step]{cursor:pointer}
.mk{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 4px;margin:1px;border-radius:6px;font:600 11.5px var(--mono);background:color-mix(in srgb,var(--g) 22%,var(--surface))}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.ctrl label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2);font-weight:500}
.ctrl select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;max-width:290px}
.ctrl input[type=range]{width:170px;accent-color:var(--ink)}
.ctrl input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;width:230px}
.check{flex-direction:row!important;align-items:center;gap:7px!important;color:var(--ink)!important;font-size:14px!important;padding-bottom:7px}
.week{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wrow{display:grid;grid-template-columns:62px repeat(5,1fr) 66px;gap:3px;align-items:center;font-size:12.5px}
.wrow>b{font-weight:600}
.day{height:34px;border-radius:5px;display:grid;place-items:center;background:color-mix(in srgb,var(--g-esc) 18%,var(--surface));color:var(--ink);font-size:11px}
.day.e{background:var(--g-emp);color:#16110d;font-weight:600}
.dayb{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;margin-top:6px}
.dayb div{display:grid;place-items:center;font-size:12px;font-weight:600;color:#16110d}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.status.na{color:var(--ink2)}
svg.chart{display:block;width:100%;height:auto;color:var(--ink)}
svg.chart text{fill:currentColor;font-family:var(--body)}
.fig{margin:0}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:8px}

/* Subsistemas */
.lens{display:flex;flex-wrap:wrap;gap:6px}
.lens button,.filter button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px}
.lens button[aria-pressed="true"],.filter button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.y{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500}
.y.yes{color:var(--ok)}.y.part{color:var(--warn)}.y.no{color:var(--ink2)}
th.hl,td.hl{background:color-mix(in srgb,var(--g-sub) 13%,transparent)}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.way{border-radius:var(--r);padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:9px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13.5px;font-weight:600}
.pill small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}

/* Evidencia */
.filter{display:flex;flex-wrap:wrap;gap:6px}
.tens{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ten{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px}
.ten header{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ten h3{display:flex;gap:7px;align-items:center;font-size:15.5px}
.nvp{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.nvp>div{padding:9px 10px;border-radius:7px;background:var(--surface2);font-size:13.3px;display:flex;flex-direction:column;gap:5px}
.nvp>div:last-child{background:color-mix(in srgb,var(--g-emp) 10%,var(--surface))}
.prio{font-size:11.5px;font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.prio.a{color:var(--bad)}.prio.m{color:var(--warn)}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:90px 1fr 22px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--s-b);min-width:2px}
.bar.z i{background:var(--bad);min-width:3px}
details summary{cursor:pointer;font-size:13px;color:var(--ink2);margin-top:8px}

/* Autodiagnóstico */
.auto{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}

function hoursPlan(c,d,mat,mad){
 if(mat<75)return{block:true,years:[]};
 const up=mad&&mat>75;
 const low=up?24:18, high=up?30:24;
 if(c==='tec')return{years:[low,high,high],up};
 if(c==='g1'||d==='m')return{years:[low],partial:c==='g1',up};
 return{years:[low,high],up};
}

 if(r.block){o.innerHTML=`<div class="note">${ic('circle-x')}<span><b>No alcanza el mínimo.</b> Con ${mat} % esta empresa no puede participar: se requiere al menos 75 % de la matriz. ${art('14 VI')}</span></div>`;return}

/* Art. 29: el aprendizaje solo vale con colaboración vigente */
function convCheck(cc,ca,start){const end=start+ca,gap=Math.max(0,end-cc);return{end,gap,ok:gap===0}}
function calcConv(){
 fillCA();
 const cc=+$('#c-t').value,ca=+$('#c-a').value,st=+$('#c-s').value;
 $('#c-so').textContent=st;
 const r=convCheck(cc,ca,st),M=Math.max(54,r.end+2),W=560,L=118,R=14,x=m=>L+(W-L-R)*m/M;
 const rows=[['Planificación',0,36,'--g-sub'],['Colaboración',0,cc,'--g-gob'],['Aprendizaje',st,Math.min(r.end,cc),'--g-esc']],last=cc-ca,yr=n=>n===12?'1 año':(n/12)+' años';
 let g='';
 for(let m=0;m<=M;m+=12)g+=`<line x1="${x(m)}" x2="${x(m)}" y1="10" y2="124" stroke="var(--line)"/><text x="${x(m)}" y="140" font-size="11" text-anchor="middle" opacity=".75">${yr(m)}</text>`;
 rows.forEach((w,i)=>{const y=18+i*36;g+=`<text x="0" y="${y+15}" font-size="12.5">${w[0]}</text><rect x="${x(w[1])}" y="${y}" width="${Math.max(0,x(w[2])-x(w[1]))}" height="22" rx="4" fill="var(${w[3]})"/>`});
 if(r.gap>0){const y=18+72;g+=`<rect x="${x(cc)}" y="${y}" width="${x(r.end)-x(cc)}" height="22" rx="4" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"/><line x1="${x(cc)}" x2="${x(cc)}" y1="10" y2="124" stroke="var(--bad)" stroke-width="2"/>`}
 const say=r.ok?`El aprendizaje termina en el mes ${r.end} y la colaboración vence en el mes ${cc}. Queda cubierto.`:`El aprendizaje terminaría en el mes ${r.end}, pero la colaboración vence en el mes ${cc}. Para quedar cubierto debe iniciar a más tardar en el mes ${last}, o renovarse la colaboración.`;
 $('#c-out').innerHTML=`<p class="res"><b>Resultado.</b> ${say}</p><figure class="fig" style="margin-top:10px"><div class="scroll"><svg class="chart" viewBox="0 0 ${W} 146" style="min-width:440px" role="img" aria-label="Línea de tiempo de planificación, colaboración y aprendizaje">${g}</svg></div></figure>
 ${r.ok?`<span class="status ok">${ic('circle-check')}Aprendizaje cubierto</span>`:`<span class="status bad">${ic('triangle-alert')}${r.gap} meses sin colaboración vigente</span>`}
 <div class="legendline" style="margin-top:8px"><span><i class="dot" style="--g:var(--g-sub)"></i>Planificación: 3 años</span><span><i class="dot" style="--g:var(--g-gob)"></i>Colaboración: ${yr(cc)}</span><span><i class="dot" style="--g:var(--g-esc)"></i>Aprendizaje: ${yr(ca)}</span></div>
 <p class="small muted" style="margin-top:8px">La planificación pide 3 años y la colaboración regular dura 2. El Acuerdo no detalla la renovación: confirmar con la SEMS. ${art('10')} ${art('22')} ${art('26')} ${art('29')}</p>`;
}

 ticks.forEach(t=>{g+=`<line x1="${x(t)}" x2="${x(t)}" y1="20" y2="${H-8}" stroke="var(--line)"/><text x="${x(t)}" y="13" font-size="11" text-anchor="middle" opacity=".75">${fmt(t)}</text>`});
 data.forEach((d,i)=>{const y=38+i*30,a=x(d[1]),b=x(d[2]),show=lbl.includes(d[0]),same=a===b;
  g+=`<g data-tip="${d[0]}: Estado de México ${fmt(d[1])}, Coahuila ${fmt(d[2])}"><rect x="0" y="${y-14}" width="${W}" height="30" fill="transparent"/><text x="0" y="${y+4}" font-size="12.5">${d[0]}</text>
  <line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="var(--s-a)" stroke-width="2"/>
  <circle cx="${b}" cy="${y}" r="7" fill="var(--s-b)" stroke="var(--surface)" stroke-width="2"/>
  <circle cx="${a}" cy="${y}" r="${same?3.5:6}" fill="var(--surface)" stroke="var(--s-a)" stroke-width="2.5"/>
  ${show?`<text x="${a-11}" y="${y+4}" font-size="11.5" text-anchor="end">${fmt(d[1])}</text><text x="${b+11}" y="${y+4}" font-size="11.5">${fmt(d[2])}</text>`:''}</g>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:520px" role="img" aria-label="${aria}">${g}</svg>`;
}

/* Puntaje: Cumple 1, Parcial .5, No 0. N/A y sin responder no cuentan. Crítico sin cumplir bloquea. */
function scoreOf(qs,ans){
 const dims={};let sum=0,cnt=0,resp=0;const blk=[];
 qs.forEach((q,i)=>{const a=ans[i];dims[q[0]]=dims[q[0]]||{s:0,c:0};
  if(a)resp++;
  if(a==='c'||a==='p'||a==='n'){const v=a==='c'?1:a==='p'?.5:0;sum+=v;cnt++;dims[q[0]].s+=v;dims[q[0]].c++}
  if(q[3]&&a!=='c'&&a!=='x')blk.push(i)});
 return{pct:cnt?Math.round(sum/cnt*100):null,dims,blk,resp,total:qs.length};
}
const level=p=>p===null?['na','Sin datos','circle-dashed']:p>=80?['ok','Sólido','circle-check']:p>=50?['warn','En desarrollo','triangle-alert']:['bad','Crítico','circle-x'];

  try{await navigator.clipboard.writeText(t);$('#cp').lastChild.textContent='Copiado'}catch(e){const a=$('#cpt');a.hidden=false;a.value=t;a.select()}};

/* Siglas: la primera mencion de cada tarjeta muestra el significado; todas se aclaran al pasar el cursor o tocar. */
const GL=Object.fromEntries(SIG);GL.Conalep=GL.CONALEP;
const SGR=new RegExp('(?<![A-Za-zÀ-ÿ])('+Object.keys(GL).sort((a,b)=>b.length-a.length).join('|')+')(?![A-Za-zÀ-ÿ])','g');
const SG_SKIP='script,style,svg,abbr,textarea,select,option,code,dt,.sgx,#sgtip';
const SG_NOEXP='button,a,th,td,.pill,summary,h1,h2,h3,h4,dl,label,.lab,.tile>b,.rt,header,footer,dialog,#fuentes';
const SG_SCOPE='details,.card,.tile,.ten,.lead,.note,article,section';
function sgText(n){
 const t=n.nodeValue,p=n.parentElement;
 if(!p||!t||p.closest(SG_SKIP))return;
 SGR.lastIndex=0;if(!SGR.test(t))return;SGR.lastIndex=0;
 const noexp=p.closest(SG_NOEXP),inter=p.closest('button,a,summary,label'),f=document.createDocumentFragment();
 let i=0,m,pend=[];
 const scope=(p.closest(SG_SCOPE)||p).cloneNode(true);scope.querySelectorAll('dl.sig,table').forEach(e=>e.remove());
 while((m=SGR.exec(t))){
  f.append(t.slice(i,m.index));i=m.index+m[0].length;
  const s=m[1],d=GL[s],a=document.createElement('abbr');
  a.className='sg';a.textContent=s;a.dataset.d=d;a.setAttribute('aria-label',s+': '+d);
  if(!inter)a.tabIndex=0;
  f.append(a);
  const key=d.split(',')[0];
  if(!noexp&&t[m.index-1]!=='('&&!scope.textContent.includes(key)&&!pend.includes(key)){
   const x=document.createElement('span');x.className='sgx';x.textContent=' ('+key+')';f.append(x);pend.push(key);
  }
 }
 f.append(t.slice(i));n.replaceWith(f);
}
function siglas(r){
 const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),L=[];
 while(w.nextNode())L.push(w.currentNode);
 L.forEach(sgText);
 r.querySelectorAll('svg text').forEach(e=>{const m=e.textContent.match(SGR);if(m&&!e.querySelector('title')){const k=document.createElementNS('http://www.w3.org/2000/svg','title');k.textContent=m.map(s=>s+': '+GL[s]).join('. ');e.append(k)}});
}
const sgo=new MutationObserver(ms=>{sgo.disconnect();
 ms.forEach(m=>m.addedNodes.forEach(n=>{if(!n.isConnected)return;if(n.nodeType===1)siglas(n);else if(n.nodeType===3)sgText(n)}));
 sgStart()});
const sgStart=()=>sgo.observe(document.body,{childList:true,subtree:true});
const sgtip=document.createElement('div');sgtip.id='sgtip';sgtip.setAttribute('role','tooltip');sgtip.hidden=true;
const sgHide=()=>{sgtip.hidden=true};
function sgShow(a){
 sgtip.innerHTML='';const b=document.createElement('b');b.textContent=a.textContent;sgtip.append(b,' '+a.dataset.d);
 const host=a.closest('dialog')||document.body;if(sgtip.parentNode!==host)host.append(sgtip);
 sgtip.hidden=false;
 const r=a.getBoundingClientRect(),W=document.documentElement.clientWidth,H=innerHeight,w=sgtip.offsetWidth,h=sgtip.offsetHeight;
 sgtip.style.left=Math.max(8,Math.min(r.left,W-w-8))+'px';
 sgtip.style.top=(r.bottom+h+10>H?Math.max(8,r.top-h-6):r.bottom+6)+'px';
}
document.addEventListener('mouseover',e=>{const a=e.target.closest&&e.target.closest('abbr.sg');if(a)sgShow(a)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('abbr.sg')&&document.activeElement!==e.target)sgHide()});
document.addEventListener('focusin',e=>{if(e.target.matches('abbr.sg'))sgShow(e.target)});
document.addEventListener('focusout',e=>{if(e.target.matches('abbr.sg'))sgHide()});
document.addEventListener('click',e=>{const a=e.target.closest('abbr.sg');a?sgShow(a):sgHide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sgHide()});
addEventListener('scroll',sgHide,{passive:true,capture:true});
siglas(document.body);document.body.append(sgtip);sgStart();
drawLinks();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawLinks);
</script>
